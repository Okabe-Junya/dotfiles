name: shellcheck

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    name: reviewdog / shellcheck
    permissions:
      contents: read
      pull-requests: write
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        uses: reviewdog/action-shellcheck@0a90156c6e0553996a217f0a9e09be6b0f6bee4c # v1.34.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          path: "."
          pattern: |
            "*.sh"
            "*.zsh"
          exclude: "./.git/*"
          check_all_files_with_shebangs: "false"
