name: herdr-app mods

on:
  pull_request:
    branches:
      - main
    paths:
      - ".config/herdr-app/**"
      - ".github/workflows/herdr-app-mods.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .config/herdr-app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: .config/herdr-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Type checking needs the API types the installed app writes, so it
      # runs locally with `npm run typecheck`.
      - name: Lint and format check
        run: npm run lint
