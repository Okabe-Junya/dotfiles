# Herdr configuration — managed in dotfiles via a file-level symlink
# (runtime artifacts in ~/.config/herdr/ — sockets, logs, session state,
# plugin lock — must stay out of the repo).
# Validate: `herdr config check`  Apply: `herdr server reload-config`

onboarding = false

[theme]
# Follow the host terminal's light/dark appearance.
auto_switch = true

[ui.toast]
# Surface agent finished / needs-attention events via macOS Notification Center.
delivery = "system"

[ui.sound]
# needs-attention = macOS "Glass", agent-finished = macOS "Blow".
# The mp3s are generated locally by install/symlink.zsh from
# /System/Library/Sounds (Apple sounds are not redistributable, so they
# are never committed). Paths resolve relative to this config file.
enabled = true
done_path = "sounds/done.mp3"
request_path = "sounds/request.mp3"

[experimental]
# Keep the macOS IME candidate window anchored to the cursor in agent panes
# that paint their own cursor (Claude Code).
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]
# Prefix-mode keys register even while the Japanese IME is active.
switch_ascii_input_source_in_prefix = true

# Self-hosted popup commands in place of marketplace plugins.

# GitHub PR status for the focused pane's repository.
[[keys.command]]
key = "prefix+i"
type = "popup"
command = "zsh -c 'gh pr status; echo; echo \"[press any key to close]\"; read -sk1'"
width = "80%"
height = "80%"

# Pick a ghq-managed repo with fzf and open it as a new workspace.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "zsh -c 'dir=\"$(ghq list -p | fzf)\" && exec herdr workspace create --cwd \"$dir\" --label \"${dir:t}\" --focus'"
width = "60%"
height = "70%"

# k9s cluster monitor popup.
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "k9s"
width = "90%"
height = "90%"

[ui]
agent_panel_sort = "spaces"
